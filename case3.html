          data-fulltext="Меня зовут Уолтер Дюранти. Я — корреспондент New York Times в Москве. Лауреат Пулитцеровской премии. Человек, который знает советскую реальность лучше любого западного журналиста. Сейчас на Западе распускают слухи. Говорят, в Советском Союзе голод. Что на Украине умирают миллионы. Эмигранты и враги советской власти кричат об ужасах. Но я был там. Я ездил по стране, разговаривал с людьми. Да, есть трудности, есть перебои с едой в некоторых районах. Это издержки великой трансформации. Советский Союз строит будущее, и небольшие жертвы неизбежны. Никакого массового голода нет. Это антисоветская пропаганда. Я написал об этом. Мои репортажи читают миллионы. Правительства принимают решения, опираясь на мои слова."
